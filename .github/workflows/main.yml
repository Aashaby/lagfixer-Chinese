name: Build LagFixer from lajczik/lagfixer

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout this repository (workspace)
        uses: actions/checkout@v4

      - name: Checkout lajczik/lagfixer
        uses: actions/checkout@v4
        with:
          repository: lajczik/lagfixer
          ref: main
          path: lagfixer

      - name: Cache Maven local (Spigot 1.16.5)
        id: cache-spigot
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/org/spigotmc
            ~/.m2/repository/net/minecraft
          key: m2-${{ runner.os }}-spigot-1.16.5-v1

      - name: Set up JDK 11 (BuildTools)
        if: steps.cache-spigot.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Install Spigot 1.16.5 into Maven local
        if: steps.cache-spigot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p buildtools
          cd buildtools
          curl -fsSL -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          java -jar BuildTools.jar --rev 1.16.5 --compile SPIGOT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x lagfixer/gradlew

      - name: Build all modules (no shadowJar needed)
        working-directory: lagfixer
        run: ./gradlew clean build --no-daemon --stacktrace --build-cache

      - name: Merge submodule jars into LagFixer-all.jar
        working-directory: lagfixer
        run: |
          mkdir -p merged
          # 先解压 plugin 以外的所有 jar（避免 plugin.yml 被提前覆盖）
          echo "Extracting non-plugin modules..."
          find . -path '*/build/libs/*.jar' \
            ! -path '*/plugin/build/libs/*' \
            ! -name '*-all.jar' \
            -exec unzip -o -q {} -d merged/ \;

          # 最后解压 plugin 模块的 jar，用主 plugin.yml 覆盖
          echo "Extracting plugin module..."
          PLUGIN_JAR=$(find . -path '*/plugin/build/libs/*.jar' ! -name '*-all.jar' -print -quit)
          if [ -n "$PLUGIN_JAR" ]; then
            unzip -o -q "$PLUGIN_JAR" -d merged/
          else
            echo "ERROR: plugin jar not found" >&2
            exit 1
          fi

          # 打包成 all.jar 放到 lagfixer/build/libs 下，方便上传
          cd merged
          jar -cf LagFixer-all.jar *
          mkdir -p ../build/libs
          mv LagFixer-all.jar ../build/libs/
          cd ..
          rm -rf merged

      - name: Get project version
        id: get_version
        working-directory: lagfixer
        run: |
          VERSION=$(./gradlew -q properties --no-daemon | awk -F': ' '/^version: /{print $2; exit}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LagFixer
          path: |
            lagfixer/**/build/libs/*.jar

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: LagFixer
          path: artifacts

      - name: Validate release tag
        shell: bash
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          REF_TAG="${{ github.ref_name }}"
          if [ "$REF_TAG" != "$VERSION" ] && [ "$REF_TAG" != "v$VERSION" ]; then
            echo "Tag '$REF_TAG' does not match Gradle version '$VERSION'" >&2
            exit 1
          fi

      - name: Verify LagFixer artifacts exist
        shell: bash
        run: |
          test -n "$(find artifacts -type f \( -name 'LagFixer*.jar' \) -print -quit)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/LagFixer*.jar
